name: Mise a jour automatique de l index

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Récupérer le code du dépôt
      uses: actions/checkout@v3
      with:
        fetch-depth: 0
        persist-credentials: true

    - name: Configurer Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'

    - name: Exécuter le script d'indexation
      run: python generer_index.py

    - name: Initialiser Git et pousser l'index
      run: |
        git config --global user.name 'GitHub Actions'
        git config --global user.email 'actions@github.com'
        
        git add -f index_fichiers.json data.js
        if git diff --cached --quiet; then
          echo "ℹ Aucun changement à committer"
        else
          # [skip ci] empêche GitHub de relancer le workflow en boucle
          git commit -m "🔄 Update index [skip ci]"
          git push origin ${{ github.ref_name }}
          echo "✅ Index mis à jour sans boucle infinie"
        fi
