name: Mise a jour automatique de l index

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Recuperer le code du dépôt
      uses: actions/checkout@v3

    - name: Configurer Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'

    - name: Executer le script d indexation
      run: python generer_index.py

    - name: Vérifier la présence du fichier généré
      run: |
        if [ -f "index_fichiers.json" ]; then
          echo "✅ Fichier index_fichiers.json généré avec succès"
          cat index_fichiers.json | head -n 5  # Affiche un aperçu
        else
          echo "❌ ERREUR : index_fichiers.json n'a pas été créé !"
          exit 1
        fi

    - name: Sauvegarder l index sur GitHub Pages
      run: |
        git config --global user.name 'GitHub Actions'
        git config --global user.email 'actions@github.com'
        # L'option -f force l'ajout, même si le fichier est dans .gitignore
        git add -f index_fichiers.json
        # Vérifie si des changements ont été effectués
        if git diff --cached --quiet; then
          echo "ℹ Aucun changement détecté dans l'index"
        else
          git commit -m "Mise à jour automatique de l'index des PDF [skip ci]"
          git push
          echo "✅ Index mis à jour et poussé avec succès"
        fi