name: Mise a jour automatique de l index

on:
  push:
    branches:
      - main
  workflow_dispatch:  # Permet l'exécution manuelle

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
    - name: Récupérer le code
      uses: actions/checkout@v3

    - name: Configurer Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'

    - name: Exécuter le script d'indexation
      run: |
        python generer_index.py
        echo "✅ Script exécuté"

    - name: Vérifier et pousser l'index
      run: |
        git config --global user.name 'GitHub Actions'
        git config --global user.email 'actions@github.com'
        git add -f index_fichiers.json
        
        if git diff --cached --quiet; then
          echo "ℹ Aucun changement"
        else
          git commit -m "🔄 Mise à jour automatique de l'index [skip ci]"
          git push
          echo "✅ Index poussé"
        fi
