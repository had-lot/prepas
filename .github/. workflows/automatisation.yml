name: Mise a jour automatique de l index

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Récupérer le code du dépôt
      uses: actions/checkout@v3
      with:
        fetch-depth: 0
        persist-credentials: true

    - name: Configurer Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'

    - name: Exécuter le script d'indexation
      run: python generer_index.py

    - name: Initialiser Git et pousser l'index
      run: |
        # Configuration Git
        git config --global user.name 'GitHub Actions'
        git config --global user.email 'actions@github.com'
        
        # Réinitialiser Git si nécessaire
        if [ ! -d ".git" ]; then
          echo "⚠️ Répertoire .git manquant, réinitialisation..."
          git init
          git remote add origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}
          git fetch origin ${{ github.ref_name }}
          git checkout ${{ github.ref_name }}
        fi
        
        # Ajouter et pousser
        git add -f index_fichiers.json
        if git diff --cached --quiet; then
          echo "ℹ Aucun changement à committer"
        else
          git commit -m "🔄 Mise à jour automatique de l'index des PDF [skip ci]"
          git push origin ${{ github.ref_name }}
          echo "✅ Index mis à jour avec succès"
        fi
